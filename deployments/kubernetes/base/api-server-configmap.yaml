apiVersion: v1
kind: ConfigMap
metadata:
  name: ros-api-server-config
data:
  ROS_API_HTTP_ADDR: ":8081"
  ROS_GAME_SERVER_ID: game-server-local
  ROS_GAME_SERVER_IDS: game-server-local
  # Leave empty locally; production overlays should inject the approved
  # collector endpoint through their environment-specific configuration.
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
